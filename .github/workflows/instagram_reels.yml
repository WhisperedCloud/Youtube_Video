name: Instagram Reels

# Two accounts, 2 Reels a day each, timed for global English peaks (times in UTC):
#   quiz  ("Guess the Place"): 13:30 (7 PM India)  and 23:30 (6:30 PM US East)
#   stoic (Stoic quotes):      01:30 (8:30 PM US East / 7 AM India) and 16:00 (9:30 PM India / 11 AM US East)
# Until an account's Instagram token is added as a secret, its runs only render + save the Reel (see Artifacts).
on:
  schedule:
    - cron: '30 13 * * *'
    - cron: '30 23 * * *'
    - cron: '30 1 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      account:
        description: 'Which account'
        type: choice
        options: [quiz, stoic, both]
        default: both
      dry_run:
        description: 'Only render and save (do not post)'
        type: boolean
        default: true

concurrency:
  group: instagram-reels
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: reels/requirements.txt

      - name: Install
        run: pip install -r reels/requirements.txt

      - name: Pick account
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "30 13 * * *"|"30 23 * * *") echo "accounts=quiz" >> "$GITHUB_OUTPUT" ;;
            "30 1 * * *"|"0 16 * * *")   echo "accounts=stoic" >> "$GITHUB_OUTPUT" ;;
            *) a="${{ inputs.account }}"; [ "$a" = "both" ] && a="quiz stoic"; echo "accounts=$a" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Make and post Reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          IG_TOKEN_QUIZ: ${{ secrets.IG_TOKEN_QUIZ }}
          IG_TOKEN_STOIC: ${{ secrets.IG_TOKEN_STOIC }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          OUT_DIR: reels_output
        run: |
          status=0
          for a in ${{ steps.pick.outputs.accounts }}; do
            python reels/main.py "$a" || status=1
          done
          exit $status

      - name: Save Reels for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reels-${{ github.run_number }}
          path: |
            reels_output/*.mp4
            reels_output/*.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Keep Instagram tokens fresh
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          for a in quiz stoic; do
            f="reels_output/new_token_$a.secret"
            if [ -s "$f" ]; then
              if [ -n "$GH_TOKEN" ]; then
                gh secret set "IG_TOKEN_$(echo $a | tr a-z A-Z)" -R "${{ github.repository }}" < "$f" && echo "Renewed token for $a"
              else
                echo "::warning::Add a GH_PAT secret so the $a Instagram token renews itself (otherwise it expires after 60 days)."
              fi
              rm -f "$f"
            fi
          done

      - name: Remember used clips and quotes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reels/used_*.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update reels trackers [skip ci]"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
