name: Automated Ambience Pipeline

on:
  schedule:
    - cron: '0 12 * * *'  # 12:00 UTC: render + upload early; videos go public at peak slots set in main.py
  workflow_dispatch:      # Allows manual trigger anytime from GitHub

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    # Give GitHub Actions permission to write back to your repository
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline
        env:
          PYTHONUNBUFFERED: '1'  # show log lines live, so a stuck run shows where it stopped
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python main.py

      - name: Commit and Push Updated Video Tracker
        if: always()  # remember used clips even when the run fails or times out
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add used_video_ids.txt
          git diff --quiet && git diff --cached --quiet || (git commit -m "chore: update used video IDs tracker [skip ci]" && git push)